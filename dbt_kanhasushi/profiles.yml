kanha_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'warehouse') }}"
      user: "{{ env_var('WAREHOUSE_USER', 'kanha_admin') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'kanha_secure_password_123') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'kanha_analytics') }}"
      schema: public
      threads: 4
      connect_timeout: 10
